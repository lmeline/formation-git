<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f9">
    <title>Mon espace Pankosmia</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#" aria-label="Mon espace Pankosmia, accueil">
          <span class="brand-mark" aria-hidden="true">p</span>
          <span>pankosmia<span class="brand-subtitle">mon espace</span></span>
        </a>

        <p class="nav-label">MON TRAVAIL</p>
        <nav class="tabs" aria-label="Mon travail">
          <button class="tab active" type="button" data-tab="today" aria-current="page">
            <span class="tab-icon" aria-hidden="true">◷</span> Ma journée
            <span class="tab-count" id="today-tab-count">—</span>
          </button>
          <button class="tab" type="button" data-tab="review">
            <span class="tab-icon" aria-hidden="true">✓</span> PR à valider
            <span class="tab-count" id="review-tab-count">—</span>
          </button>
          <button class="tab" type="button" data-tab="myissues">
            <span class="tab-icon" aria-hidden="true">◉</span> Mes issues
            <span class="tab-count" id="myissues-tab-count">—</span>
          </button>
          <button class="tab" type="button" data-tab="mypulls">
            <span class="tab-icon" aria-hidden="true">⑂</span> Mes PR
            <span class="tab-count" id="mypulls-tab-count">—</span>
          </button>
        </nav>

        <p class="nav-label">ORGANISATION</p>
        <nav class="tabs" aria-label="Organisation">
          <button class="tab" type="button" data-tab="issues">
            <span class="tab-icon" aria-hidden="true">◉</span> Toutes les issues
            <span class="tab-count" id="issue-tab-count">—</span>
          </button>
          <button class="tab" type="button" data-tab="pulls">
            <span class="tab-icon" aria-hidden="true">⑂</span> Toutes les PR
            <span class="tab-count" id="pull-tab-count">—</span>
          </button>
          <button class="tab" type="button" data-tab="repos">
            <span class="tab-icon" aria-hidden="true">▦</span> Dépôts
            <span class="tab-count" id="repo-tab-count">—</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="connection-status">Connexion aux données publiques…</span>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumbs"><span>Mon espace</span><span aria-hidden="true">/</span><strong id="breadcrumb-current">Ma journée</strong></div>
          <button class="refresh-button" id="refresh-button" type="button">
            <span aria-hidden="true">↻</span> Actualiser
          </button>
        </header>

        <section class="page-heading">
          <div>
            <p class="eyebrow">ORGANISATION · PANKOSMIA</p>
            <h1 id="page-title">Bonjour, organisons la journée.</h1>
            <p class="page-description" id="page-description">Ce que vous avez à faire aujourd’hui.</p>
          </div>
          <label class="username-field">
            <span>Votre identifiant GitHub</span>
            <input id="username-input" type="text" autocomplete="username" placeholder="Ex. : octocat" maxlength="39">
          </label>
        </section>

        <div class="toolbar" id="list-toolbar">
          <label class="search-field">
            <span class="visually-hidden">Rechercher dans les éléments</span>
            <span aria-hidden="true">⌕</span>
            <input id="search-input" type="search" placeholder="Rechercher un titre, un dépôt…">
          </label>
          <label class="repo-filter">
            <span class="visually-hidden">Filtrer par dépôt</span>
            <select id="repo-select" aria-label="Filtrer par dépôt">
              <option value="all">Tous les dépôts</option>
            </select>
          </label>
          <label class="repo-filter"><span class="visually-hidden">Filtrer par personne</span>
            <select id="person-select" aria-label="Filtrer par personne"><option value="all">Toutes les personnes</option></select>
          </label>
          <label class="repo-filter"><span class="visually-hidden">Filtrer par label</span>
            <select id="label-select" aria-label="Filtrer par label"><option value="all">Tous les labels</option></select>
          </label>
          <label class="repo-filter"><span class="visually-hidden">Filtrer par milestone</span>
            <select id="milestone-select" aria-label="Filtrer par milestone"><option value="all">Tous les milestones</option></select>
          </label>
          <label class="repo-filter"><span class="visually-hidden">Filtrer par priorité</span>
            <select id="priority-select" aria-label="Filtrer par priorité">
              <option value="all">Toutes les priorités</option>
              <option value="high">Haute / urgente</option>
              <option value="normal">Autre</option>
            </select>
          </label>
        </div>

        <div id="error-message" class="error-message" role="alert" hidden></div>
        <section id="dashboard-content" aria-live="polite"></section>
        <footer class="page-footer">Lecture seule · Données publiques de GitHub · <a href="https://github.com/pankosmia" target="_blank" rel="noreferrer">Voir l’organisation ↗</a></footer>
      </main>
    </div>
  </body>
</html>
